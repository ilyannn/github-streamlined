<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Triage</title>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --border: #d1d9e0; --text: #1f2328;
    --muted: #59636e; --accent: #0969da; --danger: #d1242f; --warn: #9a6700;
    --ok: #1a7f37; --info: #0969da; --hover: #f3f4f6; --shadow: rgba(31,35,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
      --muted: #8d96a0; --accent: #4493f8; --danger: #f85149; --warn: #d29922;
      --ok: #3fb950; --info: #4493f8; --hover: #1c2129; --shadow: rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  header a.home { color: var(--text); text-decoration: none; }
  header a.repo { color: var(--muted); font-weight: 400; text-decoration: none; }
  header a.home:hover, header a.repo:hover { color: var(--accent); text-decoration: underline; }
  .search { flex: 1; display: flex; align-items: center; gap: 6px; position: relative; }
  #query {
    flex: 1; min-width: 200px; padding: 6px 28px 6px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px;
  }
  #query:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #clear {
    position: absolute; right: 6px; border: none; background: none; color: var(--muted);
    font-size: 14px; padding: 0 4px; line-height: 1;
  }
  #clear:hover { color: var(--text); background: none; }
  button {
    padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--text); font-size: 12px; cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #status { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #viewer img { width: 24px; height: 24px; border-radius: 50%; vertical-align: middle; }
  main { max-width: 1080px; margin: 0 auto; padding: 16px 20px 60px; }
  #error {
    display: none; margin: 12px 0; padding: 10px 14px; border: 1px solid var(--danger);
    border-radius: 6px; color: var(--danger); white-space: pre-wrap;
  }
  section h2 {
    font-size: 14px; margin: 22px 0 8px; display: flex; align-items: baseline; gap: 8px;
    cursor: pointer; user-select: none;
  }
  section h2:hover .caret { color: var(--text); }
  section h2 .caret {
    color: var(--muted); font-size: 12px; width: 12px; display: inline-block;
  }
  section h2 .count {
    font-size: 12px; color: var(--muted); font-weight: 400;
    background: var(--hover); border-radius: 10px; padding: 1px 8px;
  }
  section h2 .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  .rows.collapsed { display: none; }
  .pr {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 8px; box-shadow: 0 1px 2px var(--shadow);
  }
  .pr img.avatar { width: 28px; height: 28px; border-radius: 50%; display: block; }
  .avatar-btn { background: none; border: none; padding: 0; margin-top: 2px; border-radius: 50%; }
  .avatar-btn:hover { background: none; outline: 2px solid var(--accent); }
  .pr .body { flex: 1; min-width: 0; }
  .pr .title-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pr a.title { color: var(--text); text-decoration: none; font-weight: 600; }
  .pr a.title:hover { color: var(--accent); }
  .pr .num { color: var(--muted); font-weight: 400; }
  .badge {
    font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid;
    white-space: nowrap; background: transparent; text-decoration: none;
    font-family: inherit; line-height: 1.5;
  }
  .badge.danger { color: var(--danger); border-color: var(--danger); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.info { color: var(--info); border-color: var(--info); }
  .badge.muted { color: var(--muted); border-color: var(--border); }
  a.badge:hover, button.badge:hover { background: var(--hover); }
  .chip {
    font-size: 11px; padding: 1px 8px; border-radius: 10px; white-space: nowrap;
    border: 1px solid transparent; font-family: inherit; line-height: 1.5;
  }
  button.chip:hover { filter: brightness(1.1); }
  /* Square, like the brackets it replaces — a tag, not a pill. */
  .chip.scope {
    background: var(--hover); color: var(--muted); border-color: var(--border);
    border-radius: 3px; padding: 1px 6px;
    font-weight: 600; font-family: ui-monospace, monospace; font-size: 11px;
  }
  .chip.scope:hover { color: var(--accent); border-color: var(--accent); filter: none; }
  .chip.active, .badge.active { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .meta .add { color: var(--ok); } .meta .del { color: var(--danger); }
  .meta a { color: inherit; }
  .flt {
    background: none; border: none; padding: 0; font: inherit; color: inherit;
    border-bottom: 1px dashed var(--border);
  }
  .flt:hover { background: none; color: var(--accent); border-bottom-color: var(--accent); }
  .flt.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .actions { display: flex; gap: 6px; align-items: center; position: relative; }
  /* Editing affordances stay out of the way until you hover the row they
     belong to, so a card at rest reads as information rather than controls. */
  .anchor { position: relative; display: inline-block; }
  .icon-btn {
    border: none; background: none; padding: 0 3px; color: var(--muted);
    font-size: 12px; line-height: 1; opacity: 0; transition: opacity .12s;
  }
  .pr:hover .icon-btn, .icon-btn:focus-visible, .icon-btn.open { opacity: 1; }
  .icon-btn:hover { color: var(--accent); background: none; }
  .meta .on-hover { opacity: 0; transition: opacity .12s; }
  .pr:hover .meta .on-hover, .meta .on-hover:focus-within { opacity: 1; }
  .popover {
    position: absolute; left: 0; top: 22px; z-index: 20; width: 260px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px var(--shadow); padding: 10px;
  }
  .popover input[type=text] {
    width: 100%; padding: 5px 8px; margin-bottom: 8px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--text); font-size: 12px;
  }
  .popover .list { max-height: 240px; overflow-y: auto; }
  .popover label {
    display: flex; gap: 6px; align-items: center; padding: 3px 2px;
    font-size: 12px; cursor: pointer; border-radius: 4px;
  }
  .popover label:hover { background: var(--hover); }
  .popover .foot { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  #toasts { position: fixed; bottom: 16px; right: 16px; z-index: 50; }
  .toast {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--ok);
    border-radius: 6px; padding: 10px 14px; margin-top: 8px; max-width: 420px;
    box-shadow: 0 8px 24px var(--shadow); font-size: 13px; white-space: pre-wrap;
  }
  .toast.err { border-left-color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .empty button { margin-top: 12px; }
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40;
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; width: 440px; box-shadow: 0 16px 48px var(--shadow);
  }
  .modal h3 { margin: 0 0 6px; font-size: 15px; }
  .modal p { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  .modal input {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); font: 13px ui-monospace, monospace;
  }
  .modal .suggest { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal code {
    font: 12px ui-monospace, monospace; background: var(--hover);
    padding: 1px 4px; border-radius: 4px;
  }
  /* Anchored from the right: this one hangs off a button near the right edge
     of the header, where a left-anchored panel would run off screen. */
  .popover.panel { width: 420px; top: 32px; left: auto; right: 0; }
  .panel .list { max-height: 320px; }
  .panel .cmd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .panel .cmd span { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .panel .cmd input { margin: 0; font-family: ui-monospace, monospace; }
  .panel .wt {
    display: block; width: 100%; text-align: left; border: none; background: none;
    padding: 5px 8px; border-radius: 6px; line-height: 1.3;
  }
  .panel .wt:hover, .panel .wt.sel { background: var(--hover); }
  .panel .wt .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .panel .wt .branch { font-size: 12px; font-weight: 600; }
  .panel .wt .num { font: 11px ui-monospace, monospace; color: var(--muted); }
  .panel .wt .prtitle {
    display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pr.highlight { outline: 2px solid var(--accent); outline-offset: 1px; }
  .panel .wt .path {
    display: block; font: 11px ui-monospace, monospace; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .panel .wt.detached .branch { color: var(--muted); font-weight: 400; font-style: italic; }
  .panel .wt.detached .prtitle, .panel .wt .prtitle { color: var(--muted); }
  .panel .none { color: var(--muted); font-size: 12px; padding: 8px; text-align: center; }
  kbd {
    font: 11px ui-monospace, monospace; border: 1px solid var(--border);
    border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <h1><a class="home" id="home" target="_blank" rel="noreferrer">PR Triage</a>
    <a class="repo" id="repo" target="_blank" rel="noreferrer"></a></h1>
  <div class="search">
    <input id="query" spellcheck="false" placeholder="GitHub search syntax — press / to focus, Enter to apply">
    <button id="clear" title="Reset to the default query">✕</button>
  </div>
  <span class="anchor"><button id="worktrees"
    title="Find a worktree and open it">🌳 Worktrees</button></span>
  <button class="primary" id="refresh" title="Refresh (r)">Refresh</button>
  <span id="status"></span>
  <span id="viewer"></span>
</header>
<main>
  <div id="error"></div>
  <div id="sections"><div class="empty">Loading…</div></div>
</main>
<div id="toasts"></div>

<script type="module">
import { prNumberFromPath, shortPath } from "./paths.mjs";
import { hasTerms, term, toggleTerms } from "./query.mjs";

const SECTIONS = [
  ["review",      "🎯 Review now",        "others' PRs that need your eyes"],
  ["yours_act",   "🛠️ Your PRs — act",     "feedback, failures, or new comments on your PRs"],
  ["merge_ready", "🚀 Merge-ready",        "approved with green CI"],
  ["waiting",     "⏳ Waiting",            "on authors or other reviewers"],
  ["drafts",      "📝 Drafts",             "not ready for review"],
];

// Badges that map onto a GitHub search qualifier become filter buttons; the
// rest (e.g. "pushed since your review") have no equivalent and stay inert.
const BADGE_FILTERS = {
  "approved": "review:approved",
  "changes requested": "review:changes_requested",
  "your review requested": "review-requested:@me",
};

const QUERY_KEY = "pr-triage-query";
const COLLAPSED_KEY = "pr-triage-collapsed";

const state = { prs: [], labels: [], viewer: null, repo: "", openPopover: null };
const collapsed = new Set(JSON.parse(localStorage.getItem(COLLAPSED_KEY) || "[]"));
const $ = (s, el) => (el || document).querySelector(s);

const qInput = $("#query");
qInput.value = localStorage.getItem(QUERY_KEY) || "";

function relTime(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  const units = [[31536000, "y"], [2592000, "mo"], [604800, "w"], [86400, "d"], [3600, "h"], [60, "m"]];
  for (const [sec, label] of units) if (s >= sec) return Math.floor(s / sec) + label + " ago";
  return "just now";
}

function labelStyle(hex) {
  const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return `background:#${hex};color:${lum > 0.55 ? "#000" : "#fff"}`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), isErr ? 12000 : 5000);
}

function closePopover() {
  if (state.openPopover) { state.openPopover.remove(); state.openPopover = null; }
  for (const btn of document.querySelectorAll(".icon-btn.open")) btn.classList.remove("open");
  for (const card of document.querySelectorAll(".pr.highlight")) card.classList.remove("highlight");
}

/** Nudge a popover back on screen, without pushing it off the other edge. */
function placePopover(pop) {
  if (!window.innerWidth) return;  // nothing to clamp against before first layout
  const box = pop.getBoundingClientRect();
  let shift = Math.min(0, window.innerWidth - 12 - box.right);
  if (box.left + shift < 12) shift = 12 - box.left;
  if (shift) pop.style.transform = `translateX(${shift}px)`;
}
document.addEventListener("click", e => {
  if (state.openPopover && !state.openPopover.contains(e.target)) closePopover();
});

// ------------------------------ filtering -----------------------------------

function setQuery(q) {
  qInput.value = q;
  localStorage.setItem(QUERY_KEY, q);
  load();
}

/** Add or remove a filter, keeping the rest of the query intact. */
function toggleFilter(t) {
  setQuery(toggleTerms(qInput.value, t));
}

/** Markup for a chip/badge that toggles a filter, marked active when applied. */
function filterButton(cls, t, text, style, tip) {
  const active = hasTerms(qInput.value, t) ? " active" : "";
  return `<button class="${cls}${active}" data-filter="${esc(t)}" style="${style}"
    title="${esc(tip)}">${esc(text)}</button>`;
}

// ------------------------------ loading -------------------------------------

async function load() {
  $("#status").textContent = "loading…";
  $("#refresh").disabled = true;
  try {
    const q = qInput.value.trim();
    const data = await api("/api/prs" + (q ? "?q=" + encodeURIComponent(q) : ""));
    state.prs = data.prs;
    state.viewer = data.viewer;
    state.repo = data.repo;
    if (!qInput.value) qInput.value = data.query;
    const repo = $("#repo");
    repo.textContent = data.repo;
    repo.href = `https://github.com/${data.repo}/pulls`;
    repo.title = `Open ${data.repo} pull requests on GitHub`;
    const home = $("#home");
    home.href = `https://github.com/${data.repo}`;
    home.title = `Open ${data.repo} on GitHub`;
    $("#viewer").innerHTML =
      `<a href="https://github.com/${esc(data.viewer.login)}" target="_blank" rel="noreferrer"
        ><img src="${esc(data.viewer.avatarUrl)}" title="Signed in as ${esc(data.viewer.login)}"></a>`;
    $("#error").style.display = "none";
    render();
    const when = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    $("#status").textContent = `${data.prs.length} PRs · updated ${when}`;
    document.title = `PR Triage | ${data.repo} | ${when}`;
  } catch (e) {
    $("#error").textContent = String(e.message || e);
    $("#error").style.display = "block";
    $("#status").textContent = "error";
    document.title = "PR Triage | error";
  } finally {
    $("#refresh").disabled = false;
  }
}

// ------------------------------ rendering -----------------------------------

function render() {
  const root = $("#sections");
  root.innerHTML = "";
  let shown = 0;
  for (const [key, title, hint] of SECTIONS) {
    const prs = state.prs.filter(p => p.bucket === key)
      .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    if (!prs.length) continue;
    shown += prs.length;
    const isCollapsed = collapsed.has(key);
    const sec = document.createElement("section");
    sec.innerHTML = `
      <h2 data-bucket="${key}" role="button" tabindex="0" aria-expanded="${!isCollapsed}"
          title="Click to ${isCollapsed ? "expand" : "collapse"}">
        <span class="caret">${isCollapsed ? "▸" : "▾"}</span>
        ${title} <span class="count">${prs.length}</span> <span class="hint">${hint}</span>
      </h2>
      <div class="rows${isCollapsed ? " collapsed" : ""}"></div>`;
    const rows = $(".rows", sec);
    for (const pr of prs) rows.appendChild(renderPR(pr));
    root.appendChild(sec);
  }
  if (!shown) {
    root.innerHTML = `<div class="empty">No PRs match this query 🎉<br>
      <button id="reset">Reset to the default query</button></div>`;
    $("#reset").onclick = () => setQuery("");
  }
}

function renderPR(pr) {
  const el = document.createElement("div");
  el.className = "pr";
  el.dataset.pr = pr.number;

  const badges = pr.badges.map(b => {
    // CI badges point at the run rather than a filter — there is no search
    // qualifier for "the checks on this PR".
    if (b.text.startsWith("CI")) {
      return `<a class="badge ${b.kind}" href="${esc(pr.url)}/checks" target="_blank"
        rel="noreferrer" title="Open the checks for #${pr.number}">${esc(b.text)}</a>`;
    }
    const t = BADGE_FILTERS[b.text];
    if (t) return filterButton(`badge ${b.kind}`, t, b.text, "", `Filter by ${t}`);
    return `<span class="badge ${b.kind}">${esc(b.text)}</span>`;
  }).join("");

  const labels = pr.labels.map(l => filterButton(
    "chip", term("label", l.name), l.name, labelStyle(l.color),
    `Filter by label "${l.name}"`)).join("") +
    `<span class="anchor"><button class="icon-btn" data-act="labels"
      title="Edit labels on #${pr.number}">✎</button></span>`;

  const author = filterButton(
    "flt", term("author", pr.author), pr.author, "", `Filter by author ${pr.author}`);
  const editAssignees = `<span class="anchor"><button class="icon-btn" data-act="assign"
    title="Edit assignees on #${pr.number}">✎</button></span>`;
  const assignees = pr.assignees.length
    ? " · 👤 " + pr.assignees.map(a => filterButton(
        "flt", term("assignee", a), a, "", `Filter by assignee ${a}`)).join(", ") + editAssignees
    : ` · <span class="on-hover">👤 <span class="anchor"><button class="icon-btn"
        data-act="assign" title="Assign #${pr.number}">+ assign</button></span></span>`;
  const tasks = pr.tasksTotal ? ` · ☑ ${pr.tasksDone}/${pr.tasksTotal}` : "";

  // Titles here are conventionally "[scope] what changed"; lift the scope out
  // into its own box so it reads as a tag and can filter like one.
  const scope = /^\[([^\]]+)\]\s*/.exec(pr.title);
  const scopeBox = scope
    ? filterButton("chip scope", `"[${scope[1]}]" in:title`, scope[1], "",
        `Filter to "${scope[1]}" in the title`)
    : "";
  const title = scope ? pr.title.slice(scope[0].length) : pr.title;

  el.innerHTML = `
    <button class="avatar-btn" data-filter="${esc(term("author", pr.author))}"
      title="Filter by author ${esc(pr.author)}">
      <img class="avatar" src="${esc(pr.avatarUrl)}" alt="${esc(pr.author)}">
    </button>
    <div class="body">
      <div class="title-row">
        ${scopeBox}
        <a class="title" href="${esc(pr.url)}" target="_blank" rel="noreferrer">${esc(title)}
          <span class="num">#${pr.number}</span></a>
        ${badges}${labels}
      </div>
      <div class="meta">
        by ${author} · opened ${relTime(pr.createdAt)} · updated ${relTime(pr.updatedAt)}
        · <span class="add">+${pr.additions}</span> <span class="del">−${pr.deletions}</span>
        · <a href="${esc(pr.url)}" target="_blank" rel="noreferrer"
             title="Open the conversation">💬 ${pr.commentCount}</a>${tasks}${assignees}
      </div>
    </div>
    <div class="actions">
      <button data-act="checkout" title="${esc(pr.worktree
        ? `Open ${pr.worktree}`
        : `Create a worktree for #${pr.number} and open it`)}">${
        pr.worktree ? "📂 Open worktree" : "⎇ Add worktree"}</button>
    </div>`;

  $('[data-act="checkout"]', el).onclick = () => checkout(pr, el);
  for (const [act, show] of [["labels", labelPopover], ["assign", assignPopover]]) {
    const btn = $(`[data-act="${act}"]`, el);
    btn.onclick = e => {
      e.stopPropagation();
      // show() closes any open popover first, which clears .open from every
      // icon — so claim it back afterwards to stay visible while ours is up.
      show(pr, btn.closest(".anchor"));
      btn.classList.add("open");
    };
  }
  return el;
}

// One delegated listener covers every filter button and section header, so
// re-rendering never has to rewire them.
$("#sections").addEventListener("click", e => {
  const filter = e.target.closest("[data-filter]");
  if (filter) { toggleFilter(filter.dataset.filter); return; }
  const head = e.target.closest("h2[data-bucket]");
  if (head) toggleSection(head.dataset.bucket);
});
$("#sections").addEventListener("keydown", e => {
  const head = e.target.closest("h2[data-bucket]");
  if (head && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleSection(head.dataset.bucket); }
});

function toggleSection(key) {
  if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
  localStorage.setItem(COLLAPSED_KEY, JSON.stringify([...collapsed]));
  render();
}

// ------------------------------ actions -------------------------------------

async function checkout(pr, el) {
  const command = await ensureOpenCommand();
  if (!command) return;  // cancelled at the dialog
  const btn = $('[data-act="checkout"]', el);
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "… working";
  try {
    const res = await api("/api/checkout", post({ number: pr.number, open: command }));
    toast(`${res.created ? "Added" : "Opened"} worktree for ${res.branch}\n${res.path}` +
      (res.opened ? `\n→ ${res.opened}` : ""));
    load();  // the button flips to "Open worktree" once the worktree is there
  } catch (e) {
    toast(`#${pr.number}: ${e.message}`, true);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

function post(body) {
  return {
    method: "POST",
    // Not a CORS-safelisted header, so a page on another origin cannot send
    // this request without a preflight the server never answers.
    headers: { "Content-Type": "application/json", "X-PR-Triage": "1" },
    body: JSON.stringify(body),
  };
}

// ------------------------------ open command --------------------------------

const OPEN_KEY = "pr-triage-open-command";
const SUGGESTIONS = ["code", "cursor", "zed", "subl", "idea", "open"];

async function ensureOpenCommand() {
  const saved = localStorage.getItem(OPEN_KEY);
  if (saved) return saved;
  const chosen = await askOpenCommand("");
  if (chosen) localStorage.setItem(OPEN_KEY, chosen);
  return chosen;
}

// ------------------------------ worktree picker -----------------------------

async function worktreePanel(anchor) {
  closePopover();
  const pop = document.createElement("div");
  pop.className = "popover panel";
  pop.addEventListener("click", e => e.stopPropagation());
  pop.innerHTML = `
    <div class="cmd"><span>Open in</span>
      <input type="text" data-cmd spellcheck="false" placeholder="code"
        value="${esc(localStorage.getItem(OPEN_KEY) || "")}"></div>
    <input type="text" data-search spellcheck="false" placeholder="Search branch or folder…">
    <div class="list">Loading…</div>`;
  anchor.appendChild(pop);
  placePopover(pop);
  state.openPopover = pop;

  const cmd = $("[data-cmd]", pop);
  const search = $("[data-search]", pop);
  const list = $(".list", pop);
  cmd.oninput = () => localStorage.setItem(OPEN_KEY, cmd.value.trim());
  search.focus({ preventScroll: true });  // focusing must not scroll the list away

  const data = await api("/api/worktrees");
  // The PR list already knows which worktree each PR sits in, so join on that
  // rather than asking GitHub again. A worktree whose PR is outside the
  // current query still shows its number, taken from the directory name.
  const prByPath = new Map(state.prs.filter(p => p.worktree).map(p => [p.worktree, p]));
  const numberOf = w => prByPath.get(w.path)?.number ?? prNumberFromPath(w.path);

  let shown = [], sel = 0;

  const draw = () => {
    const needle = search.value.trim().toLowerCase();
    shown = data.worktrees.filter(w => {
      const pr = prByPath.get(w.path);
      const number = numberOf(w);
      return [w.branch || "detached", w.path, number ? `#${number}` : "", pr?.title ?? ""]
        .join(" ").toLowerCase().includes(needle);
    });
    sel = Math.min(sel, Math.max(shown.length - 1, 0));
    list.innerHTML = shown.length
      ? shown.map((w, i) => {
          const pr = prByPath.get(w.path);
          const number = numberOf(w);
          return `<button class="wt${w.branch ? "" : " detached"}${i === sel ? " sel" : ""}"
            data-path="${esc(w.path)}"${pr ? ` data-pr="${pr.number}"` : ""}>
            <span class="top">
              <span class="branch">${esc(w.branch || "detached")}</span>
              ${number ? `<span class="num">#${number}</span>` : ""}
            </span>
            ${pr ? `<span class="prtitle">${esc(pr.title)}</span>` : ""}
            <span class="path">${esc(shortPath(w.path, data.mainCheckout))}</span>
          </button>`;
        }).join("")
      : `<div class="none">No worktree matches</div>`;
    for (const row of list.querySelectorAll(".wt")) {
      row.onclick = () => openWorktree(row.dataset.path, cmd.value.trim());
      // Point at the card this worktree belongs to while the mouse is on it,
      // then fall back to whatever the keyboard has selected.
      row.onmouseenter = () => highlightPR(row.dataset.pr);
      row.onmouseleave = () => highlightPR(list.querySelector(".wt.sel")?.dataset.pr);
    }
    highlightPR(shown[sel] && prByPath.get(shown[sel].path)?.number);
  };
  draw();

  search.oninput = () => { sel = 0; draw(); };
  search.onkeydown = e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      sel = Math.max(0, Math.min(shown.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1)));
      draw();
      list.querySelector(".wt.sel")?.scrollIntoView({ block: "nearest" });
    }
    if (e.key === "Enter" && shown[sel]) openWorktree(shown[sel].path, cmd.value.trim());
  };
}

/** Ring the card for a PR, and bring it into view if it is just off screen. */
function highlightPR(number) {
  for (const card of document.querySelectorAll(".pr.highlight")) card.classList.remove("highlight");
  if (!number) return;
  const card = document.querySelector(`.pr[data-pr="${number}"]`);
  if (!card) return;
  card.classList.add("highlight");
  card.scrollIntoView({ block: "nearest" });
}

async function openWorktree(path, command) {
  const opener = command || await ensureOpenCommand();
  if (!opener) return;
  localStorage.setItem(OPEN_KEY, opener);
  closePopover();
  try {
    const res = await api("/api/open", post({ path, open: opener }));
    toast(`${res.branch || "detached"}\n${res.path}\n→ ${res.opened}`);
  } catch (e) {
    toast(`Open failed:\n${e.message}`, true);
  }
}

/** Resolves to the command string, or null if cancelled. */
function askOpenCommand(current) {
  return new Promise(resolve => {
    const back = document.createElement("div");
    back.className = "backdrop";
    back.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-label="Open command">
        <h3>How should a worktree open?</h3>
        <p>Runs <code>&lt;command&gt; &lt;folder&gt;</code> — your editor, or
          <code>open</code> for the file manager. Saved in this browser; change it
          any time from the header.</p>
        <input type="text" spellcheck="false" placeholder="code" value="${esc(current)}">
        <div class="suggest">${SUGGESTIONS.map(s =>
          `<button class="chip" style="background:var(--hover);color:var(--text)"
            data-pick="${s}">${s}</button>`).join("")}</div>
        <div class="foot">
          <button data-cancel>Cancel</button>
          <button class="primary" data-save>Save</button>
        </div>
      </div>`;
    document.body.appendChild(back);
    const input = $("input", back);
    input.focus(); input.select();

    const done = value => { back.remove(); resolve(value); };
    for (const pick of back.querySelectorAll("[data-pick]")) {
      pick.onclick = () => { input.value = pick.dataset.pick; input.focus(); };
    }
    $("[data-cancel]", back).onclick = () => done(null);
    $("[data-save]", back).onclick = () => done(input.value.trim() || null);
    back.onclick = e => { if (e.target === back) done(null); };
    back.addEventListener("keydown", e => {
      if (e.key === "Enter") done(input.value.trim() || null);
      if (e.key === "Escape") { e.stopPropagation(); done(null); }
    });
  });
}

async function ensureLabels() {
  if (!state.labels.length) state.labels = await api("/api/labels");
  return state.labels;
}

async function labelPopover(pr, anchor) {
  closePopover();
  const pop = document.createElement("div");
  pop.className = "popover";
  pop.addEventListener("click", e => e.stopPropagation());
  pop.innerHTML = `<input type="text" placeholder="Filter labels…"><div class="list">Loading…</div>
    <div class="foot"><button data-cancel>Cancel</button><button class="primary" data-apply>Apply</button></div>`;
  anchor.appendChild(pop);
  placePopover(pop);
  state.openPopover = pop;

  const current = new Set(pr.labels.map(l => l.name));
  const labels = await ensureLabels();
  const list = $(".list", pop);
  const draw = filter => {
    list.innerHTML = "";
    for (const l of labels) {
      if (filter && !l.name.toLowerCase().includes(filter)) continue;
      const row = document.createElement("label");
      row.innerHTML = `<input type="checkbox" value="${esc(l.name)}" ${current.has(l.name) ? "checked" : ""}>
        <span class="chip" style="${labelStyle(l.color)}">${esc(l.name)}</span>`;
      list.appendChild(row);
    }
  };
  draw("");
  $("input[type=text]", pop).oninput = e => draw(e.target.value.toLowerCase());
  $("[data-cancel]", pop).onclick = closePopover;
  $("[data-apply]", pop).onclick = async () => {
    const checked = new Set([...pop.querySelectorAll(".list input:checked")].map(i => i.value));
    const add = [...checked].filter(n => !current.has(n));
    const remove = [...current].filter(n => !checked.has(n));
    closePopover();
    if (!add.length && !remove.length) return;
    try {
      await api("/api/labels", post({ number: pr.number, add, remove }));
      toast(`#${pr.number}: labels updated` +
        (add.length ? `\n+ ${add.join(", ")}` : "") + (remove.length ? `\n− ${remove.join(", ")}` : ""));
      load();
    } catch (e) { toast(`Relabel #${pr.number} failed:\n${e.message}`, true); }
  };
}

function assignPopover(pr, anchor) {
  closePopover();
  const pop = document.createElement("div");
  pop.className = "popover";
  pop.addEventListener("click", e => e.stopPropagation());
  const current = pr.assignees.map(a =>
    `<label><input type="checkbox" checked value="${esc(a)}"> ${esc(a)} <span style="color:var(--muted)">(uncheck to remove)</span></label>`).join("");
  pop.innerHTML = `
    <button data-me style="width:100%;margin-bottom:8px">Assign me (${esc(state.viewer.login)})</button>
    <input type="text" placeholder="Add login…">
    <div class="list">${current}</div>
    <div class="foot"><button data-cancel>Cancel</button><button class="primary" data-apply>Apply</button></div>`;
  anchor.appendChild(pop);
  placePopover(pop);
  state.openPopover = pop;

  $("[data-me]", pop).onclick = async () => {
    closePopover();
    try {
      await api("/api/assignees", post({ number: pr.number, add: [state.viewer.login] }));
      toast(`#${pr.number}: assigned to you`); load();
    } catch (e) { toast(`Assign failed:\n${e.message}`, true); }
  };
  $("[data-cancel]", pop).onclick = closePopover;
  $("[data-apply]", pop).onclick = async () => {
    const typed = $("input[type=text]", pop).value.trim();
    const keep = new Set([...pop.querySelectorAll(".list input:checked")].map(i => i.value));
    const add = typed ? [typed] : [];
    const remove = pr.assignees.filter(a => !keep.has(a));
    closePopover();
    if (!add.length && !remove.length) return;
    try {
      await api("/api/assignees", post({ number: pr.number, add, remove }));
      toast(`#${pr.number}: assignees updated`); load();
    } catch (e) { toast(`Assign #${pr.number} failed:\n${e.message}`, true); }
  };
}

// ------------------------------ chrome --------------------------------------

$("#refresh").onclick = load;
$("#clear").onclick = () => setQuery("");
$("#worktrees").onclick = e => {
  e.stopPropagation();
  worktreePanel($("#worktrees").closest(".anchor"));
};
qInput.addEventListener("keydown", e => {
  if (e.key === "Enter") setQuery(qInput.value);
  if (e.key === "Escape") qInput.blur();
});

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (e.key === "Escape" && state.openPopover) { closePopover(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); qInput.focus(); qInput.select(); }
  if (e.key === "r") { e.preventDefault(); load(); }
  if (e.key === "w") { e.preventDefault(); $("#worktrees").click(); }
});

setInterval(() => { if (document.visibilityState === "visible") load(); }, 120000);
load();
</script>
